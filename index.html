<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#FFFFFF;--surface:#FFFFFF;--surface2:#F5F5F7;--border:#E5E5EA;
  --text:#000000;--muted:#8E8E93;--light:#A9A9AF;
  --clay:#007AFF;--sage:#34C759;--blue:#007AFF;--purple:#AF52DE;
  --green:#34C759;--red:#FF3B30;--amber:#FF9500;
  --r:12px;--r-s:8px;
  --shadow:0 1px 3px rgba(0,0,0,.08);--shadow-md:0 4px 12px rgba(0,0,0,.12);
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;min-height:100vh;font-size:16px;line-height:1.6;}
input,select,button,textarea{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;}

/* ── NAV ── */
.nav{display:flex;align-items:center;gap:0;background:var(--surface);border-bottom:1px solid var(--border);padding:0 16px;position:sticky;top:0;z-index:50;min-height:56px;box-shadow:0 1px 2px rgba(0,0,0,.06);}
.nav-brand{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:20px;font-weight:700;color:var(--text);margin-right:16px;white-space:nowrap;flex-shrink:0;letter-spacing:-0.5px;}
.nav-brand span{color:var(--clay);}
.nav-tabs{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none;-ms-overflow-style:none;}
.nav-tabs::-webkit-scrollbar{display:none;}
.nav-tab{padding:6px 12px;border-radius:var(--r-s);font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap;transition:all .15s;flex-shrink:0;}
.nav-tab:hover{background:var(--surface2);color:var(--text);}
.nav-tab.active{background:var(--clay);color:#fff;}
.nav-right{display:flex;align-items:center;gap:8px;margin-left:12px;flex-shrink:0;}
.sync-badge{font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px;background:var(--surface2);color:var(--muted);white-space:nowrap;}
.sync-badge.offline{background:rgba(196,74,74,.1);color:var(--red);}

/* ── CONTENT ── */
.content{max-width:1100px;margin:0 auto;padding:20px 16px 40px;}
.tab-panel{display:none;}
.tab-panel.active{display:block;}

/* ── CARDS ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.08);}
.card+.card{margin-top:14px;}
.card h3{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:14px;}
.stack{display:flex;flex-direction:column;gap:14px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}

/* ── MONTH NAV ── */
.month-nav{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
.month-nav h2{font-size:20px;font-weight:700;flex:1;}
.mnb{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-s);padding:5px 12px;font-size:18px;color:var(--muted);cursor:pointer;transition:.15s;}
.mnb:hover{background:var(--surface2);}
.today-btn{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-s);padding:5px 12px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;}
.month-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;}
.mchip{padding:4px 10px;border-radius:20px;font-size:12px;font-weight:500;background:var(--surface);border:1px solid var(--border);color:var(--muted);cursor:pointer;transition:.15s;}
.mchip.active{background:var(--clay);color:#fff;border-color:var(--clay);}

/* ── STAT CARDS ── */
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.08);}
.stat-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px;}
.stat-value{font-size:26px;font-weight:700;line-height:1.1;}
.stat-sub{font-size:12px;color:var(--muted);margin-top:3px;}
.stat-value.clay{color:var(--clay);}
.stat-value.sage{color:var(--sage);}
.stat-value.red{color:var(--red);}
.stat-value.amber{color:var(--amber);}
.stat-value.blue{color:var(--blue);}
.stat-value.purple{color:var(--purple);}

/* ── GAUGE ── */
.gauge-wrap{margin:4px 0 10px;}
.gauge-track{height:10px;border-radius:5px;background:var(--surface2);overflow:hidden;position:relative;border:1px solid var(--border);}
.gauge-fill{height:100%;border-radius:5px;transition:width .4s;}
.gauge-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--light);margin-top:4px;}
.gauge-labels .over{color:var(--red);font-weight:700;}
.stacked-gauge{display:flex;height:10px;border-radius:5px;overflow:hidden;border:1px solid var(--border);}
.stacked-seg{height:100%;transition:width .4s;}

/* ── VERDICT ── */
.verdict{padding:10px 14px;border-radius:var(--r-s);font-size:13px;font-weight:600;margin-top:12px;}
.verdict-ok{background:rgba(45,155,111,.1);color:var(--green);}
.verdict-warn{background:rgba(196,139,42,.1);color:var(--amber);}
.verdict-bad{background:rgba(196,74,74,.1);color:var(--red);}
.verdict-muted{background:var(--surface2);color:var(--muted);}

/* ── LEGEND ── */
.legend-row{display:flex;align-items:center;gap:8px;font-size:13px;padding:4px 0;}
.legend-row strong{margin-left:auto;font-variant-numeric:tabular-nums;}
.ldot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}

/* ── CAT GRID ── */
.cat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.cat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-s);padding:12px;position:relative;overflow:hidden;}
.cat-card::before{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;border-radius:0 0 var(--r-s) var(--r-s);}
.cat-card.fixo::before{background:var(--blue);}
.cat-card.variavel::before{background:var(--clay);}
.cat-card.misto::before{background:var(--purple);}
.cat-card-name{font-size:12px;font-weight:600;margin-bottom:2px;}
.cat-card-type{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:1px 5px;border-radius:3px;display:inline-block;margin-bottom:6px;}
.cat-card-type.fixo{background:rgba(74,127,196,.12);color:var(--blue);}
.cat-card-type.variavel{background:rgba(196,113,74,.12);color:var(--clay);}
.cat-card-type.misto{background:rgba(124,92,191,.12);color:var(--purple);}
.cat-bar-wrap{margin:6px 0 4px;}
.cat-bar-track{height:4px;border-radius:2px;background:var(--surface2);overflow:hidden;}
.cat-bar-fill{height:100%;border-radius:2px;}
.cat-amounts{display:flex;justify-content:space-between;font-size:12px;}
.cat-amounts .spent{font-weight:700;}
.cat-amounts .budget{color:var(--muted);}
.cat-pago-btn{position:absolute;top:8px;right:8px;border:none;border-radius:20px;font-size:10px;font-weight:700;padding:2px 8px;cursor:pointer;transition:.15s;}
.cat-pago-btn.pago{background:rgba(45,155,111,.15);color:var(--green);border:1px solid rgba(45,155,111,.3);}
.cat-pago-btn.pendente{background:rgba(196,139,42,.1);color:var(--amber);border:1px solid rgba(196,139,42,.2);}
.cat-card.fixo.pago-ok{border-color:rgba(45,155,111,.4);background:rgba(45,155,111,.04);}
.cat-card.fixo.pago-ok::before{background:var(--green);}

/* ── TREND CHART ── */
.chart-wrap{position:relative;width:100%;overflow:hidden;}

/* ── INSIGHTS ── */
.insight-row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--border);font-size:13px;}
.insight-row:first-of-type{border-top:none;}
.insight-ico{font-size:16px;flex-shrink:0;margin-top:1px;}
.insight-text p{margin:0;line-height:1.5;}

/* ── FORM ── */
.form-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);}
.form-section+.form-section{margin-top:14px;}
.form-section h3{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:14px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:12px;font-weight:600;color:var(--muted);}
.field input,.field select,.field textarea{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-s);padding:9px 12px;color:var(--text);font-size:14px;transition:border-color .15s;width:100%;}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--clay);}
.field textarea{resize:vertical;min-height:56px;}
.new-cat-box{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-s);padding:12px;margin-bottom:12px;display:flex;flex-direction:column;gap:8px;}
.new-cat-box input,.new-cat-box select{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-s);padding:8px 10px;color:var(--text);font-size:13px;width:100%;}

/* ── OCR ── */
.ocr-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.ocr-half{display:flex;align-items:center;justify-content:center;gap:7px;background:var(--surface2);border:1.5px dashed var(--border);border-radius:var(--r-s);padding:11px;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;transition:.15s;width:100%;}
.ocr-half:hover{border-color:var(--clay);color:var(--clay);}
.ocr-banner{display:flex;gap:8px;align-items:flex-start;border-radius:var(--r-s);padding:10px 12px;margin-bottom:12px;font-size:13px;}
.ocr-ok{background:rgba(45,155,111,.1);color:var(--green);}
.ocr-err{background:rgba(196,74,74,.1);color:var(--red);}
.ocr-banner p{flex:1;margin:0;line-height:1.4;}
.ocr-banner button{background:none;border:none;cursor:pointer;color:inherit;font-size:16px;padding:0;}

/* ── BUTTONS ── */
.btn{border-radius:10px;padding:10px 18px;font-size:15px;font-weight:600;cursor:pointer;border:none;transition:.2s;display:inline-flex;align-items:center;gap:6px;}
.btn-primary{background:var(--clay);color:#fff;box-shadow:0 2px 8px rgba(0,122,255,.3);}
.btn-primary:hover{background:#0051D5;box-shadow:0 4px 12px rgba(0,122,255,.4);}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted);}
.btn-ghost:hover{background:var(--surface2);}
.btn-block{width:100%;justify-content:center;padding:11px;}
.btn-sm{padding:5px 10px;font-size:12px;}
.btn-danger{color:var(--red);border-color:var(--red);}
.btn-primary.btn-danger{background:var(--red);color:#fff;}
.row-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:8px;}
.sec-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.sec-header h3{margin-bottom:0;}

/* ── LANÇAMENTOS LIST ── */
.entry-list{display:flex;flex-direction:column;gap:0;}
.entry-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--border);}
.entry-row:first-child{border-top:none;}
.entry-main{flex:1;min-width:0;}
.entry-main strong{display:block;font-size:13px;font-weight:600;}
.entry-main span{font-size:11.5px;color:var(--muted);}
.entry-amt{font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;white-space:nowrap;}
.icon-btn{background:none;border:none;color:var(--muted);padding:5px;cursor:pointer;font-size:15px;border-radius:6px;transition:.15s;}
.icon-btn:hover{background:var(--surface2);}
.icon-btn.danger{color:var(--red);}
.edit-block{flex:1;display:flex;flex-direction:column;gap:6px;}
.edit-block input,.edit-block select{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:6px 9px;color:var(--text);font-size:12px;width:100%;}
.edit-r2{display:grid;grid-template-columns:1fr 1fr;gap:5px;}

/* ── PREMIOS ── */
.premio-row{display:flex;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--border);font-size:13px;}
.premio-row:first-child{border-top:none;}
.premio-info{flex:1;min-width:0;}
.premio-info strong{display:block;font-size:13px;font-weight:600;}
.premio-info span{font-size:11px;color:var(--muted);}
.badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;white-space:nowrap;}
.badge-r{background:rgba(45,155,111,.12);color:var(--green);}
.badge-p{background:rgba(196,139,42,.12);color:var(--amber);}
.badge-pa{background:rgba(74,127,196,.12);color:var(--blue);}

/* ── CALENDÁRIO PRÉMIOS ── */
.cal-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;margin:12px 0;}
.cal-month{display:flex;flex-direction:column;gap:4px;align-items:center;}
.cal-label{font-size:10px;color:var(--muted);font-weight:600;}
.cal-pill{font-size:10px;font-weight:600;padding:3px 6px;border-radius:6px;text-align:center;white-space:nowrap;}
.cal-pill.recv{background:rgba(45,155,111,.12);color:var(--green);border:1px solid rgba(45,155,111,.25);}
.cal-pill.prev{background:rgba(196,139,42,.1);color:var(--amber);border:1px solid rgba(196,139,42,.2);}
.cal-pill.parc{background:rgba(74,127,196,.1);color:var(--blue);border:1px solid rgba(74,127,196,.2);}
.cal-legend{display:flex;gap:14px;font-size:11px;margin-top:6px;}
.cal-leg-item{display:flex;align-items:center;gap:5px;}
.cal-leg-dot{width:8px;height:8px;border-radius:50%;}

/* ── RECOMPENSAS ── */
.recomp-section{background:rgba(124,92,191,.05);border:1px solid rgba(124,92,191,.2);border-radius:var(--r);padding:20px;}
.recomp-section h3{color:var(--purple);}

/* ── POUPANÇA / SAVINGS ── */
.savings-bar-wrap{margin:10px 0;}
.savings-month-row{display:grid;grid-template-columns:60px 1fr 80px 80px;gap:8px;align-items:center;padding:5px 0;border-top:1px solid var(--border);font-size:13px;}
.savings-month-row:first-child{border-top:none;}
.savings-bar-track{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;}
.savings-bar-fill{height:100%;border-radius:4px;}

/* ── REGRA 50/30/20 ── */
.rule-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--border);font-size:13px;}
.rule-row:first-child{border-top:none;}
.rule-label{width:130px;flex-shrink:0;font-weight:500;}
.rule-bar-wrap{flex:1;}
.rule-bar-track{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;}
.rule-bar-fill{height:100%;border-radius:4px;}
.rule-pct{width:45px;text-align:right;font-weight:700;}
.rule-target{width:80px;font-size:11px;color:var(--muted);}

/* ── SCORE ── */
.score-circle{width:80px;height:80px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;border:3px solid var(--border);flex-shrink:0;}
.score-num{font-size:24px;font-weight:800;line-height:1;}
.score-max{font-size:11px;color:var(--muted);}

/* ── CAT SETTINGS ── */
.cat-set-row{display:flex;align-items:center;gap:5px;padding:5px 0;}
.cat-set-name{flex:1;min-width:0;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:6px 9px;color:var(--text);font-size:12px;}
.cat-set-row select{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:5px;color:var(--text);font-size:11px;}
.cat-set-row input[type=number]{width:72px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:5px 7px;color:var(--text);font-size:11px;}
.shield-btn{background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--muted);padding:5px 7px;cursor:pointer;font-size:12px;}
.shield-btn.on{color:var(--green);border-color:var(--green);}

/* ── BUDGET GRID ── */
.budget-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;}
.budget-cell{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted);}
.budget-cell input{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:6px 7px;color:var(--text);font-size:12px;width:100%;}

/* ── EXTRAS TABLE ── */
.xtable{width:100%;border-collapse:collapse;font-size:13px;}
.xtable th{text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:6px 8px;border-bottom:2px solid var(--border);}
.xtable td{padding:9px 8px;border-bottom:1px solid var(--border);}
.xtable tr:last-child td{border-bottom:none;}

/* ── LIVROS ── */
.book-stats{display:flex;gap:20px;font-size:13px;color:var(--muted);margin-bottom:16px;}
.book-stat strong{color:var(--text);display:block;font-size:20px;font-weight:700;}
.book-filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.bfilter{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:500;background:var(--surface2);border:1px solid var(--border);color:var(--muted);cursor:pointer;}
.bfilter.active{background:var(--clay);color:#fff;border-color:var(--clay);}
.book-list{display:flex;flex-direction:column;gap:6px;}
.book-row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface2);border-radius:var(--r-s);font-size:13px;cursor:pointer;transition:.12s;}
.book-row:hover{background:var(--border);}
/* ── MODAL LIVROS ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;}
.modal-box{background:var(--surface);border-radius:20px;padding:28px 24px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;box-shadow:0 8px 28px rgba(0,0,0,.15);position:relative;}
.modal-box h2{font-family:'Lora',serif;font-size:22px;font-weight:600;margin-bottom:20px;}
.modal-close{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:50%;background:var(--surface2);border:1px solid var(--border);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted);}
.modal-field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;}
.modal-field label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);}
.modal-field input,.modal-field select{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-s);padding:10px 14px;color:var(--text);font-size:14px;width:100%;}
.modal-field input:focus,.modal-field select:focus{outline:none;border-color:var(--clay);}
.modal-row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.modal-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--border);}
.status-pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;}
.status-pill{padding:7px 16px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:var(--surface2);color:var(--muted);transition:.15s;}
.status-pill.sp-para{border-color:var(--sage);background:rgba(107,143,113,.12);color:var(--sage);}
.status-pill.sp-aler{border-color:var(--blue);background:rgba(74,127,196,.12);color:var(--blue);}
.status-pill.sp-lido{border-color:var(--green);background:rgba(45,155,111,.12);color:var(--green);}

// ══ PULL DE DADOS COMPLETO (ao iniciar) ══
async function pullFullDataFromSupabase(){
  try{
    const r=await fetch(SUPABASE_URL+'/rest/v1/despesas_state?id=eq.main&select=data,updated_at',{
      headers:{...SB_HEADERS,'Accept':'application/vnd.pgrst.object+json'}
    });
    if(!r.ok)throw new Error(r.status);
    const row=await r.json();
    if(row&&row.data&&Object.keys(row.data).length){
      lastSyncOk=true;
      return row.data;
    }
    return null;
  }catch(e){
    lastSyncOk=false;
    return null;
  }
}

// ══ PUSH DE OPERAÇÕES INDIVIDUAIS ══
async function syncSingleOp(op){
  try{
    // grava o estado completo na mesma tabela de onde lê (despesas_state)
    const now=new Date().toISOString();
    const r=await fetch(SUPABASE_URL+'/rest/v1/despesas_state?id=eq.main',{
      method:'PATCH',
      headers:{...SB_HEADERS,'Prefer':'return=representation'},
      body:JSON.stringify({data:S,updated_at:now})
    });
    if(!r||!r.ok)throw new Error(r?.status||'Unknown');
    const rows=await r.json();
    if(!Array.isArray(rows)||rows.length===0)throw new Error('Nenhuma linha atualizada');
    lastSyncOk=true;
    return true;
  }catch(e){
    console.warn('Sync falhou',e);
    lastSyncOk=false;
    return false;
  }
}

// ══ SINCRONIZAR FILA PENDENTE ══
async function pushPendingOps(){
  if(pendingOps.length===0){
    if(lastSyncOk)setSyncBadge('ok');
    return;
  }

  setSyncBadge('syncing');
  for(let op of pendingOps){
    const success=await syncSingleOp(op);
    if(!success){
      setSyncBadge('offline');
      return;
    }
  }
  pendingOps=[];
  lastSyncOk=true;
  setSyncBadge('ok');
}

// ══ AUTO-RELOAD OU MANUAL ══
async function refreshFromRemote(){
  setSyncBadge('syncing');
  const remote=await pullFullDataFromSupabase();
  if(remote&&remote.exps){
    S=remote;
    pendingOps=[]; // limpar fila se conseguiu atualizar
    setSyncBadge('ok');
    renderTab(currentTab);
    toast('Dados atualizados do servidor.','');
  } else {
    setSyncBadge('offline');
  }
}

function addPendingOp(type,id,data,remoteUpdatedAt){
  // Adiciona operação à fila para sincronizar
  pendingOps.push({type,id,data,remoteUpdatedAt});
}

function save(){
  // 1. guarda local imediatamente (offline-first)
  try{localStorage.setItem(SK,JSON.stringify(S));}catch(e){toast('Erro ao guardar localmente.','err');}
  // 2. sincroniza operações pendentes (debounced, 700ms)
  clearTimeout(syncTimer);
  syncTimer=setTimeout(pushPendingOps,700);
}

async function load(){
  setSyncBadge('syncing');
  const remote=await pullFullDataFromSupabase();
  if(remote&&remote.cats&&remote.cats.length){
    S=remote;

    // sem dados remotos — tenta cache local, senão seed
    try{
      const r=localStorage.getItem(SK);
      if(r){S=JSON.parse(r);}

    }catch{buildSeed();}
    setSyncBadge(lastSyncOk?'ok':'offline');

  S.exps.forEach(e=>{if(!e.updated_at)e.updated_at=e.createdAt||new Date().toISOString();});

}
// Garante que todas as categorias fixas têm lançamento em todos os meses do ano corrente

function ensureFixas(){
  const year=new Date().getFullYear();
  let changed=false;
  S.cats.filter(c=>c.type==='fixo').forEach(cat=>{
    for(let m=1;m<=12;m++){
      const exists=S.exps.some(e=>e.categoryId===cat.id&&e.year===year&&e.month===m);
      if(!exists&&cat.budget>0){
        S.exps.push({id:uid('ef'),categoryId:cat.id,month:m,year,amount:cat.budget,note:'auto',createdAt:new Date(year,m-1,1).toISOString()});
        changed=true;
      }
    }
  });
  if(changed)save();
}

  S.livros=SEED_LIVROS;S.extrasIn=SEED_EXTRAS_IN;S.extrasOut=SEED_EXTRAS_OUT;S.invest=SEED_INVEST;
  save();
}

/* ══ COMPUTAÇÕES ══ */
function aggMonth(y,m){
  // Filtrar apenas itens não apagados (deleted_at = null)
  const es=S.exps.filter(e=>!e.deleted_at&&e.year===y&&e.month===m);
  const byType={fixo:0,variavel:0,misto:0};const byC={};
  es.forEach(e=>{
    const cat=S.cats.find(c=>c.id===e.categoryId);const t=cat?cat.type:'variavel';
    byType[t]=(byType[t]||0)+e.amount;
    if(!byC[e.categoryId])byC[e.categoryId]={id:e.categoryId,name:cat?cat.name:'—',type:t,total:0,budget:cat?cat.budget:0,prot:cat?!!cat.prot:false};
    byC[e.categoryId].total+=e.amount;
  });
  return{es,byType,total:byType.fixo+byType.variavel+byType.misto,byCat:Object.values(byC).sort((a,b)=>b.total-a.total)};
}
function getBudget(y,m){const k=mk(y,m);return S.budgets[k]!==undefined?S.budgets[k]:S.defaultBudget;}
function getInsights(y,m){
  return S.cats.filter(c=>c.type!=='fixo'&&!c.prot).map(cat=>{
    const hist={};
    S.exps.forEach(e=>{if(e.categoryId!==cat.id||(e.year===y&&e.month===m))return;const k=e.year+'-'+e.month;hist[k]=(hist[k]||0)+e.amount;});
    const vals=Object.values(hist);
    const cur=S.exps.filter(e=>e.categoryId===cat.id&&e.year===y&&e.month===m).reduce((s,e)=>s+e.amount,0);
    if(!cur||!vals.length)return null;
    const avg=vals.reduce((s,v)=>s+v,0)/vals.length;
    return{cat,cur,avg,delta:avg>0?((cur-avg)/avg)*100:0};
  }).filter(Boolean).sort((a,b)=>b.delta-a.delta);
}

function renderComprasList(query){
  const q=ns(query||'');
  const compras=S.exps.filter(e=>e.year===selYear&&e.items&&e.items.length>0)
    .sort((a,b)=>new Date(b.date||b.createdAt)-new Date(a.date||a.createdAt));
  const filtered=q?compras.filter(e=>{
    const cat=S.cats.find(c=>c.id===e.categoryId);
    const haystack=ns((cat?cat.name:'')+' '+(e.note||'')+' '+(e.items||[]).join(' '));
    return haystack.includes(q);
  }):compras;

  if(compras.length===0){
    return `<p style="font-size:13px;color:var(--muted);padding:12px 0">Ainda sem compras com itens registados. Adiciona itens ao lançar despesas para os veres aqui.</p>`;
  }
  if(filtered.length===0){
    return `<p style="font-size:13px;color:var(--muted);padding:12px 0">Nenhuma compra encontrada para "${esc(query)}".</p>`;
  }
  return filtered.map(e=>{
    const cat=S.cats.find(c=>c.id===e.categoryId);
    const d=e.date||(e.year+'-'+String(e.month).padStart(2,'0')+'-01');
    return `<div style="padding:10px 0;border-top:1px solid var(--border)">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">
        <strong style="font-size:13px">${esc(cat?cat.name:'—')}${e.note?' · '+esc(e.note):''}</strong>
        <span style="font-family:ui-monospace,monospace;font-weight:700;font-size:13px;white-space:nowrap">${eur(e.amount)}</span>
      </div>
      <div style="font-size:11.5px;color:var(--muted);margin-top:2px">${new Date(d+'T00:00:00').toLocaleDateString('pt-PT',{day:'2-digit',month:'short',year:'numeric'})}</div>
      <div style="font-size:13px;margin-top:4px">🛒 ${e.items.map(esc).join(' · ')}</div>
    </div>`;
  }).join('');
}
function filterCompras(q){
  const el2=el('compras-list');
  if(el2)el2.innerHTML=renderComprasList(q);
}

let _livroModalStatus='Para Ler';

function setLivroStatus(s){
  _livroModalStatus=s;
  el('lm-status').value=s;
  ['para','comp','aler','lido'].forEach(k=>el('sp-'+k).className='status-pill');
  const map={['Para Ler']:'sp-para',['Comprado']:'sp-comp',['A ler']:'sp-aler',['Lido']:'sp-lido'};
  const cls={'Para Ler':'sp-para','Comprado':'sp-comp','A ler':'sp-aler','Lido':'sp-lido'};
  const clsName={'Para Ler':'sp-para','Comprado':'sp-comp','A ler':'sp-aler','Lido':'sp-lido'};
  const pill=el(clsName[s]);
  if(pill) pill.className='status-pill sp-'+({'Para Ler':'para','Comprado':'comp','A ler':'aler','Lido':'lido'}[s]);
}

function openLivroModal(id){
  const modal=el('livro-modal');
  if(id){
    const b=S.livros.find(l=>l.id===id);
    if(!b)return;
    el('lm-title').textContent='Editar Livro';
    el('lm-id').value=id;
    el('lm-titulo').value=b.titulo||'';
    el('lm-autor').value=b.autor||'';
    el('lm-cat').value=b.cat||'Aprender';
    el('lm-nota').value=b.nota||'';
    el('lm-inicio').value=b.inicio?b.inicio.includes('-')&&b.inicio.length===7?b.inicio+'-01':b.inicio:'';
    el('lm-fim').value=b.fim||'';
    setLivroStatus(b.status||'Para Ler');
  } else {
    el('lm-title').textContent='Novo Livro';
    el('lm-id').value='';
    el('lm-titulo').value='';
    el('lm-autor').value='';
    el('lm-cat').value='Aprender';
    el('lm-nota').value='';
    el('lm-inicio').value='';
    el('lm-fim').value='';
    setLivroStatus('Para Ler');
  }
  modal.style.display='flex';
  setTimeout(()=>el('lm-titulo').focus(),100);
}

function closeLivroModal(e){
  if(e&&e.target!==el('livro-modal'))return;
  el('livro-modal').style.display='none';
}

function saveLivroModal(){
  const titulo=(el('lm-titulo').value||'').trim();
  if(!titulo){el('lm-titulo').focus();return;}
  const id=el('lm-id').value;
  const data={
    titulo,
    autor:(el('lm-autor').value||'').trim()||'—',
    cat:el('lm-cat').value||'Aprender',
    status:el('lm-status').value||'Para Ler',
    nota:parseInt(el('lm-nota').value)||0,
    inicio:el('lm-inicio').value?el('lm-inicio').value.slice(0,7):'',
    fim:el('lm-fim').value?el('lm-fim').value.slice(0,7):'',
  };
  if(id){
    S.livros=S.livros.map(l=>l.id===id?{...l,...data}:l);
    toast('Livro actualizado.');
  } else {
    S.livros.push({id:uid('l'),...data});
    toast('Livro adicionado.');
  }
  save();
  el('livro-modal').style.display='none';
  renderLivros();
}

function delLivro(id){S.livros=S.livros.filter(l=>l.id!==id);save();toast('Removido.');renderLivros();}

/* ══ POUPANÇA ══ */
function renderPoupanca(){
  const months=[];let acc=0;
  for(let i=1;i<=12;i++){
    const a=aggMonth(selYear,i);const b=getBudget(selYear,i);
    const poupado=i<=selMonth?Math.max(b-a.total,0):b-aggMonth(selYear,selMonth).total;
    acc+=i<=selMonth?Math.max(b-a.total,0):getBudget(selYear,i)-aggMonth(selYear,selMonth).total;
    months.push({mes:MS[i-1],poupado:i<=selMonth?Math.max(b-a.total,0):0,acc,future:i>selMonth,orcamento:b,gasto:a.total});
  }
  const extrasTotalIn=S.extrasIn.reduce((s,e)=>s+e.valor,0);
  const investTotal=S.exps.filter(e=>{const cat=S.cats.find(c=>c.id===e.categoryId);return cat&&cat.name==='Investimentos'&&e.year===selYear;}).reduce((s,e)=>s+e.amount,0);
  const ytdPoupado=months.filter((_,i)=>i+1<=selMonth).reduce((s,m)=>s+m.poupado,0);
  const maxPoup=Math.max(...months.map(m=>m.poupado),1);

  el('poupanca-body').innerHTML=`<div class="stack">
  <div class="grid4">
    <div class="stat-card"><div class="stat-label">Poupado YTD</div><div class="stat-value sage">${eur(ytdPoupado)}</div><div class="stat-sub">do orçamento</div></div>

    <div class="stat-card"><div class="stat-label">Projeção Anual</div><div class="stat-value">${eur(months[months.length-1].acc+ytdPoupado)}</div><div class="stat-sub">se mantiveres o ritmo</div></div>
  </div>
  <div class="card">
    <h3>Acumulado Mensal</h3>
    ${months.map((m,i)=>`<div class="savings-month-row">
      <span style="font-weight:600;${m.future?'color:var(--muted)':''}">${m.mes}</span>
      <div class="savings-bar-track"><div class="savings-bar-fill" style="width:${m.poupado/maxPoup*100}%;background:${m.future?'var(--border)':CL.green}"></div></div>
      <span style="color:var(--muted);font-size:12px">${m.future?'previsto':'+'+eur(m.poupado)}</span>
      <span style="font-weight:600;font-size:12px">${eur(m.acc)} ac.</span>
    </div>`).join('')}
  </div></div>`;
}

// OCR
async function resizeImg(file,max){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;if(w>h&&w>max){h=Math.round(h*max/w);w=max;}else if(h>=w&&h>max){w=Math.round(w*max/h);h=max;}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',0.72).split(',')[1]);};img.onerror=()=>rej();img.src=r.result;};r.onerror=()=>rej();r.readAsDataURL(file);});}
async function handleOcr(file){if(!file)return;ocrStatus='loading';renderLancar();try{const b64=await resizeImg(file,1280);const catNames=S.cats.map(c=>c.name);const resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:'image/jpeg',data:b64}},{type:'text',text:'Analisa este recibo e devolve APENAS JSON valido sem markdown: {"amount":numero_ou_null,"merchant":string_ou_null,"date":"YYYY-MM-DD_ou_null","categoria_sugerida":"uma_destas: '+catNames.join(' | ')+' ou null","nota":"resumo 3-5 palavras ou null","itens":["lista dos artigos/produtos individuais visiveis no recibo, nomes curtos, maximo 10 itens, ou array vazio se nao for possivel identificar"]}'}]}]})});if(!resp.ok)throw new Error(resp.status);const data=await resp.json();const txt=(data.content||[]).find(b=>b.type==='text')?.text||'';ocrResult=JSON.parse(txt.replace(/```json|```/g,'').trim());if(!ocrResult.amount)throw new Error('no amount');ocrStatus='ok';}catch{ocrStatus='err';ocrResult=null;}renderLancar();}
function triggerCam(){const inp=el('cam-input');inp.onchange=e=>{handleOcr(e.target.files[0]);inp.value='';};inp.click();}
function triggerGal(){const inp=el('gal-input');inp.onchange=e=>{handleOcr(e.target.files[0]);inp.value='';};inp.click();}

function updateCatBudget(id,v){
  const val=parseFloat(v);
  if(isNaN(val)||val<0)return;
  // 1. actualiza orçamento da categoria
  S.cats=S.cats.map(c=>c.id===id?{...c,budget:val}:c);
  const cat=S.cats.find(c=>c.id===id);
  // 2. se for fixa, actualiza todos os lançamentos do mês actual em diante (não toca no passado)
  if(cat&&cat.type==='fixo'){
    const now=new Date();
    const curY=now.getFullYear();
    const curM=now.getMonth()+1;
    S.exps=S.exps.map(e=>{
      if(e.categoryId!==id)return e;
      // meses futuros = ano maior, ou mesmo ano mas mês >= actual
      const isFuture=(e.year>curY)||(e.year===curY&&e.month>=curM);
      return isFuture?{...e,amount:val}:e;
    });
    // garante que existem lançamentos para meses futuros onde ainda não há
    for(let m=curM;m<=12;m++){
      const exists=S.exps.some(e=>e.categoryId===id&&e.year===curY&&e.month===m);
      if(!exists&&val>0){
        S.exps.push({id:uid('ef'),categoryId:id,month:m,year:curY,amount:val,note:'auto',createdAt:new Date(curY,m-1,1).toISOString()});
      }
    }
    toast('Orçamento actualizado — meses de Julho em diante ajustados.');
  } else {
    toast('Orçamento actualizado.');
  }
  save();
  renderDefinicoes();
}

    <button class="btn btn-ghost btn-danger" onclick="clearYearData()">Apagar todos os lançamentos de ${selYear}</button>

function addNewCatDef(){
  const name=(el('nf-nome')?.value||'').trim();
  const type=el('nf-tipo')?.value||'fixo';
  const budget=parseFloat(el('nf-budget')?.value)||0;
  if(!name)return;
  let id=slugify(name),n=2;
  while(S.cats.find(c=>c.id===id)){id=slugify(name)+'-'+n;n++;}
  S.cats.push({id,name,type,budget,prot:false});
  save();
  // se for fixa, gera lançamentos automáticos para todos os meses do ano
  if(type==='fixo'&&budget>0){
    const year=new Date().getFullYear();
    for(let m=1;m<=12;m++){
      S.exps.push({id:uid('ef'),categoryId:id,month:m,year,amount:budget,note:'auto',createdAt:new Date(year,m-1,1).toISOString()});
    }
    save();
  }
  toast('Categoria criada.');
  renderDefinicoes();
}

// ── MODAL DE CATEGORIA (dashboard por despesa) ──
let _catModalId=null;

function openCatModal(id){
  _catModalId=id;
  renderCatModal();
  el('cat-modal').style.display='flex';
}
function closeCatModal(e){
  if(e&&e.target!==el('cat-modal'))return;
  el('cat-modal').style.display='none';
  _catModalId=null;
}
function renderCatModal(){
  const c=S.cats.find(x=>x.id===_catModalId);
  if(!c)return;
  const entries=S.exps.filter(e=>e.categoryId===c.id&&e.year===selYear&&e.month===selMonth)
    .sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  const total=entries.reduce((s,e)=>s+e.amount,0);
  const over=c.budget>0&&total>c.budget;
  // acumulado do ano + média mensal
  const yearTotals=[];
  for(let m=1;m<=12;m++){
    yearTotals.push(S.exps.filter(e=>e.categoryId===c.id&&e.year===selYear&&e.month===m).reduce((s,e)=>s+e.amount,0));
  }
  const ytd=yearTotals.slice(0,selMonth).reduce((s,v)=>s+v,0);
  const media=ytd/Math.max(selMonth,1);
  const maxY=Math.max(...yearTotals,1);
  const pagoKey=c.id+'-'+selYear+'-'+selMonth;
  const isPago=!!(S.pagos&&S.pagos[pagoKey]);

  el('cat-modal-body').innerHTML=`
    <h2 style="margin-bottom:4px">${esc(c.name)}</h2>
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:18px">
      <span class="cat-card-type ${c.type}">${c.type.toUpperCase()}</span>
      ${c.type==='fixo'?`<button class="cat-pago-btn ${isPago?'pago':'pendente'}" style="position:static" onclick="togglePago('${c.id}');renderCatModal()">${isPago?'✓ Pago':'Pendente'}</button>`:''}
    </div>

    <div class="grid3" style="margin-bottom:16px">
      <div class="stat-card" style="padding:12px"><div class="stat-label">Gasto ${MS[selMonth-1]}</div><div class="stat-value ${over?'red':'clay'}" style="font-size:20px">${eur(total)}</div></div>
      <div class="stat-card" style="padding:12px"><div class="stat-label">Acumulado ano</div><div class="stat-value" style="font-size:20px">${eur(ytd)}</div></div>
      <div class="stat-card" style="padding:12px"><div class="stat-label">Média/mês</div><div class="stat-value blue" style="font-size:20px">${eur(media)}</div></div>
    </div>

    <div class="modal-field">
      <label>Orçamento mensal (€)</label>
      <input type="number" step=".01" value="${c.budget||0}" onblur="updateCatBudget('${c.id}',this.value);renderCatModal();renderDash()"/>
    </div>

    <div class="modal-field">
      <label>Evolução ${selYear}</label>
      <div style="display:flex;gap:4px;align-items:flex-end;height:64px;padding:4px 0">
        ${yearTotals.map((v,i)=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px">
          <div style="width:100%;height:${Math.max(v/maxY*48,2)}px;background:${i+1===selMonth?'var(--clay)':v>0?'rgba(196,113,74,.35)':'var(--border)'};border-radius:3px" title="${MS[i]}: ${eur(v)}"></div>
          <span style="font-size:9px;color:var(--muted)">${MS[i][0]}</span>
        </div>`).join('')}
      </div>
    </div>

    <div class="modal-field">
      <label>Lançamentos de ${MN[selMonth-1]}</label>
      ${entries.length===0?'<p style="font-size:13px;color:var(--muted);padding:8px 0">Sem lançamentos este mês.</p>':
      entries.map(e=>`<div style="display:flex;flex-direction:column;gap:5px;padding:7px 0;border-top:1px solid var(--border)">
        <div style="display:flex;gap:6px;align-items:center">
          <input type="number" step=".01" value="${e.amount}" onblur="catModalUpdAmt('${e.id}',this.value)" style="width:90px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:7px 9px;font-size:13px;color:var(--text)"/>
          <input value="${esc(e.note||'')}" placeholder="comentário" onblur="catModalUpdNote('${e.id}',this.value)" style="flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:7px 9px;font-size:13px;color:var(--text)"/>
          <button class="icon-btn danger" onclick="catModalDel('${e.id}')">🗑</button>
        </div>
        <input value="${esc(itemsStr(e.items))}" placeholder="itens comprados, separados por vírgula" onblur="catModalUpdItems('${e.id}',this.value)" style="background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:6px 9px;font-size:12px;color:var(--muted)"/>
      </div>`).join('')}
    </div>

    <div class="modal-field">
      <label>+ Novo lançamento em ${MN[selMonth-1]}</label>
      <div style="display:flex;gap:6px;margin-bottom:6px">
        <input id="cm-amt" type="number" step=".01" placeholder="Valor €" style="width:110px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:9px;font-size:14px;color:var(--text)"/>
        <input id="cm-note" placeholder="comentário (opcional)" style="flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:9px;font-size:14px;color:var(--text)"/>
      </div>
      <div style="display:flex;gap:6px">
        <input id="cm-items" placeholder="itens comprados, separados por vírgula (até 10)" style="flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:9px;font-size:14px;color:var(--text)"/>
        <button class="btn btn-primary btn-sm" onclick="catModalAdd()">Lançar</button>
      </div>
    </div>`;
}
function catModalUpdAmt(id,v){
  const val=parseFloat(String(v).replace(',','.'));
  if(!val||val<=0)return;
  S.exps=S.exps.map(e=>e.id===id?{...e,amount:val}:e);
  save();toast('Atualizado.');renderCatModal();renderDash();
}
function catModalUpdNote(id,v){
  S.exps=S.exps.map(e=>e.id===id?{...e,note:v||''}:e);
  save();
}
function catModalUpdItems(id,v){
  S.exps=S.exps.map(e=>e.id===id?{...e,items:parseItems(v)}:e);
  save();toast('Itens atualizados.');
}
function catModalDel(id){
  S.exps=S.exps.filter(e=>e.id!==id);
  save();toast('Removido.');renderCatModal();renderDash();
}
function catModalAdd(){
  const val=parseFloat(String(el('cm-amt')?.value||'').replace(',','.'));
  const note=el('cm-note')?.value||'';
  const items=parseItems(el('cm-items')?.value);
  if(!val||val<=0||!_catModalId)return;
  S.exps.push({id:uid('e'),categoryId:_catModalId,amount:val,month:selMonth,year:selYear,date:selYear+'-'+String(selMonth).padStart(2,'0')+'-'+String(new Date().getDate()).padStart(2,'0'),note,items,createdAt:new Date().toISOString()});
  save();toast('Lançado.');renderCatModal();renderDash();
}
